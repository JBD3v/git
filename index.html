<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample HTML Page FOUR</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        line-height: 1.6;
      }
      h1 {
        color: #333;
      }
      .card {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 1rem;
        max-width: 700px;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 0.6rem 1rem;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to My Sample Page</h1>

    <div class="card">
      <p>This is a simple HTML example showing common page elements.</p>

      <h2>Features</h2>
      <ul>
        <li>Headings</li>
        <li>Paragraphs</li>
        <li>Lists</li>
        <li>Buttons</li>
      </ul>

      <h2>Contact Form</h2>
      <form>
        <label for="name">Name:</label><br />
        <input type="text" id="name" name="name" /><br /><br />

        <label for="email">Email:</label><br />
        <input type="email" id="email" name="email" /><br /><br />

        <button type="submit">Send</button>
      </form>
    </div>
  </body>
</html>
